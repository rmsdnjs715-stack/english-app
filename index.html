<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Talk English">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Talk English</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#22c55e; --me:#2563eb; --err:#f87171; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 -apple-system,system-ui,sans-serif;
           padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); min-height:100dvh; }
    main { max-width:560px; margin:0 auto; padding:16px 0; display:flex; flex-direction:column; min-height:100dvh; }
    h1 { font-size:22px; margin:8px 0 16px; }
    .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:12px; }
    button { font:inherit; color:var(--text); background:var(--card); border:0; border-radius:12px; padding:14px 16px; width:100%; text-align:left; }
    button.primary { background:var(--accent); color:#052e16; font-weight:700; text-align:center; }
    button.small { width:auto; padding:8px 14px; }
    input[type=password], input[type=text] { width:100%; font:inherit; padding:12px; border-radius:10px; border:1px solid #334155; background:#0b1220; color:var(--text); }
    .row { display:flex; gap:8px; margin:8px 0; }
    .row > * { flex:1; }
    .seg button { text-align:center; } .seg button.on { background:var(--accent); color:#052e16; font-weight:700; }
    .muted { color:var(--muted); font-size:14px; }
    #scenarios { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    #scenarios .card { margin:0; font-size:15px; padding:14px 12px; }
    #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:12px; }
    .msg { padding:10px 14px; border-radius:14px; max-width:85%; white-space:pre-wrap; }
    .msg.ai { background:var(--card); align-self:flex-start; }
    .msg.me { background:var(--me); align-self:flex-end; }
    .msg.fb { background:#14532d; align-self:stretch; max-width:100%; }
    #status { min-height:22px; text-align:center; color:var(--muted); font-size:14px; }
    #status.err { color:var(--err); }
    #talk { background:var(--accent); color:#052e16; font-weight:800; font-size:20px; text-align:center; padding:26px; user-select:none; -webkit-user-select:none; touch-action:none; }
    #talk.rec { background:#ef4444; color:#fff; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<main>
  <section id="home">
    <h1>Talk English</h1>
    <div class="card" id="keyBox">
      <div class="muted" style="margin-bottom:8px">Groq API 키 (이 폰에만 저장됩니다)</div>
      <input id="key" type="password" placeholder="gsk_..." autocomplete="off">
      <div class="row"><button class="primary small" id="saveKey">저장</button></div>
    </div>
    <button class="primary" id="reviewBtn" style="margin-bottom:12px">📚 복습하기</button>
    <div class="muted">레벨</div>
    <div class="row seg" id="levels">
      <button data-level="beginner">초급</button>
      <button data-level="intermediate">중급</button>
    </div>
    <div class="muted" style="margin-top:12px">직접 상황 입력</div>
    <div class="row">
      <input id="custom" type="text" maxlength="100" placeholder="예: 미용실에서 머리 자르기" autocomplete="off">
      <button class="primary small" id="customGo" style="flex:none">시작</button>
    </div>
    <div class="muted" style="margin-top:12px">상황을 고르세요</div>
    <div id="scenarios"></div>
  </section>

  <section id="review" class="hidden">
    <div class="row"><button class="small" id="rvClose" style="flex:none">← 나가기</button></div>
    <div class="muted" id="rvProgress" style="margin:8px 0"></div>
    <div class="card" style="min-height:160px">
      <div id="rvFront" style="font-size:20px;white-space:pre-wrap"></div>
      <div id="rvBack" class="hidden" style="margin-top:16px;border-top:1px solid #334155;padding-top:12px">
        <div id="rvBackText" style="font-size:20px;font-weight:700;color:var(--accent)"></div>
        <div id="rvNote" class="muted" style="margin-top:6px"></div>
        <button class="small" id="rvSpeak" style="margin-top:10px">🔊 다시 듣기</button>
      </div>
    </div>
    <button class="primary" id="rvReveal">정답 보기</button>
    <div class="row hidden" id="rvGrade">
      <button id="rvMissed" style="text-align:center;background:#7f1d1d">😵 몰랐어</button>
      <button id="rvKnew" style="text-align:center;background:#14532d">😎 알았어</button>
    </div>
  </section>

  <section id="chat" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="row" style="flex:none">
      <button class="small" id="back" style="flex:none">← 나가기</button>
      <button class="small" id="finish" style="flex:none">끝내고 피드백</button>
    </div>
    <div id="log"></div>
    <div id="status"></div>
    <div class="row" style="flex:none">
      <input id="text" type="text" placeholder="말하기 어려우면 입력" autocomplete="off" autocapitalize="sentences">
      <button class="small" id="send" style="flex:none">전송</button>
    </div>
    <button id="talk">🎤 누르고 말하기</button>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
