<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Talk English">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131f24" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <title>Talk English</title>
  <style>
    /* Duolingo tokens (insane-design/duolingo/design.md): light + official dark pairs */
    :root {
      --owl:#58cc02; --tree-frog:#58a700; --macaw:#1cb0f6; --whale:#1899d6;
      --cardinal:#ff4b4b; --fire-ant:#ea2b2b; --bee:#ffc800; --camel:#e5a600;
      --snow:#ffffff; --polar:#f7f7f7; --swan:#e5e5e5; --hare:#afafaf; --wolf:#777777; --eel:#4b4b4b;
      --sea-sponge:#d7ffb8; --walking-fish:#ffdfe0; --iguana:#ddf4ff; --canary:#fff5d3;
      --on-color:#ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --owl:#93d333; --tree-frog:#79b933; --macaw:#49c0f8; --whale:#3f85a7;
        --cardinal:#ee5555; --fire-ant:#d84848; --bee:#ffc700;
        --snow:#131f24; --polar:#202f36; --swan:#37464f; --hare:#52656d; --wolf:#dce6ec; --eel:#f1f7fb;
        --sea-sponge:rgb(147 211 51 / .14); --walking-fish:rgb(238 85 85 / .14); --iguana:rgb(73 192 248 / .14); --canary:#202f36;
        --on-color:#131f24;
      }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--snow); color:var(--eel); font:500 17px/1.5 "Nunito", ui-rounded, -apple-system, sans-serif;
           padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); min-height:100dvh; }
    main { max-width:560px; margin:0 auto; padding:16px 0; display:flex; flex-direction:column; min-height:100dvh; }
    h1 { font-size:28px; font-weight:900; color:var(--owl); margin:8px 0 18px; letter-spacing:-0.01em; }
    .label { color:var(--wolf); font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; margin:18px 0 8px; }
    .muted { color:var(--wolf); font-size:14px; }
    .card { background:var(--snow); border:2px solid var(--swan); border-radius:16px; padding:16px; margin-bottom:12px; }

    /* Signature: pressable toy buttons — flat face on a hard 4px edge */
    button { font:inherit; font-weight:800; color:var(--eel); background:var(--snow); border:2px solid var(--swan);
             border-radius:16px; padding:13px 16px; width:100%; text-align:left; cursor:pointer;
             box-shadow:0 4px 0 var(--swan); margin-bottom:4px; transition:transform .06s, box-shadow .06s; }
    button:active { transform:translateY(4px); box-shadow:none; }
    button.primary, .btn-green { background:var(--owl); border-color:var(--owl); color:var(--on-color); box-shadow:0 4px 0 var(--tree-frog);
             text-align:center; text-transform:uppercase; letter-spacing:0.04em; }
    .btn-blue { background:var(--macaw); border-color:var(--macaw); color:var(--on-color); box-shadow:0 4px 0 var(--whale); text-align:center; }
    .btn-red { background:var(--cardinal); border-color:var(--cardinal); color:var(--on-color); box-shadow:0 4px 0 var(--fire-ant); text-align:center; }
    button.small { width:auto; padding:8px 14px; font-size:15px; }
    .icon-btn { width:40px; height:40px; padding:0; border-radius:50%; text-align:center; font-size:18px; flex:none; box-shadow:0 3px 0 var(--swan); margin:0; }

    input[type=password], input[type=text] { width:100%; font:inherit; padding:12px 14px; border-radius:16px; border:2px solid var(--swan);
             background:var(--polar); color:var(--eel); outline:none; }
    input:focus { border-color:var(--macaw); }
    .row { display:flex; gap:8px; margin:8px 0; align-items:flex-start; }
    .row > * { flex:1; }
    .seg button { text-align:center; } .seg button.on { background:var(--iguana); border-color:var(--macaw); color:var(--macaw); box-shadow:0 4px 0 var(--macaw); }

    #scenarios { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    #scenarios .card { margin:0; font-size:15px; padding:14px 12px; min-height:88px; display:flex; flex-direction:column; gap:6px; justify-content:center; }
    #scenarios .emoji { font-size:28px; line-height:1; }

    #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:12px; }
    .msg { padding:12px 14px; border-radius:16px; max-width:85%; white-space:pre-wrap; }
    .msg.ai { background:var(--snow); border:2px solid var(--swan); align-self:flex-start; display:flex; gap:10px; align-items:flex-start; }
    .msg.ai .icon-btn { width:32px; height:32px; font-size:15px; }
    .msg.me { background:var(--macaw); color:var(--on-color); align-self:flex-end; font-weight:700; }
    .msg.fb { background:var(--polar); border:2px solid var(--swan); align-self:stretch; max-width:100%; }
    #status { min-height:22px; text-align:center; color:var(--wolf); font-size:14px; font-weight:700; }
    #status.err { color:var(--cardinal); }

    /* Feedback cards */
    .fb { display:flex; flex-direction:column; gap:10px; align-self:stretch; }
    .fb h3 { margin:6px 0 0; font-size:16px; font-weight:900; }
    .fb-praise { background:var(--canary); border:2px solid var(--bee); border-radius:16px; padding:12px 14px; font-weight:700; }
    .fb-fix { border:2px solid var(--swan); border-radius:16px; overflow:hidden; }
    .fb-line { display:flex; gap:10px; align-items:center; padding:10px 12px; }
    .fb-line .txt { flex:1; }
    .fb-wrong { background:var(--walking-fish); color:var(--fire-ant); text-decoration:line-through; text-decoration-thickness:1px; }
    .fb-right { background:var(--sea-sponge); color:var(--tree-frog); font-weight:800; }
    .fb-why { padding:8px 12px 12px; color:var(--wolf); font-size:15px; }
    .fb-expr { display:flex; gap:10px; align-items:center; border:2px solid var(--swan); border-radius:16px; padding:10px 12px; }
    .fb-expr .en { font-weight:800; } .fb-expr .ko { color:var(--wolf); font-size:14px; }
    .fb-saved { text-align:center; color:var(--macaw); font-weight:800; font-size:14px; }

    .hold { text-align:center; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; }
    .hold.rec { background:var(--cardinal) !important; border-color:var(--cardinal) !important; color:var(--on-color) !important; box-shadow:0 4px 0 var(--fire-ant) !important; }
    #talk { font-size:20px; padding:22px; }
    #talkKo { padding:12px; font-size:15px; }
    #hints { display:flex; flex-direction:column; gap:6px; }
    .hintChip { background:var(--canary); border-color:var(--bee); box-shadow:0 4px 0 var(--camel); white-space:pre-wrap; font-size:15px; padding:10px 12px; }
    #shadow { margin-top:12px; padding:16px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<main>
  <section id="home">
    <h1>Talk English</h1>
    <div class="card" id="keyBox">
      <div class="muted" style="margin-bottom:8px">Groq API 키 (이 폰에만 저장됩니다)</div>
      <input id="key" type="password" placeholder="gsk_..." autocomplete="off">
      <div class="row"><button class="primary small" id="saveKey">저장</button></div>
    </div>
    <button class="primary" id="reviewBtn" style="margin-bottom:12px">📚 복습하기</button>
    <div class="label">레벨</div>
    <div class="row seg" id="levels">
      <button data-level="beginner">🌱 초급</button>
      <button data-level="intermediate">🌳 중급</button>
    </div>
    <div class="label">직접 상황 입력</div>
    <div class="row">
      <input id="custom" type="text" maxlength="100" placeholder="예: 미용실에서 머리 자르기" autocomplete="off">
      <button class="primary small" id="customGo" style="flex:none">시작</button>
    </div>
    <div class="label">상황을 고르세요</div>
    <div id="scenarios"></div>
  </section>

  <section id="review" class="hidden">
    <div class="row"><button class="small" id="rvClose" style="flex:none">← 나가기</button></div>
    <div class="muted" id="rvProgress" style="margin:8px 0"></div>
    <div class="card" style="min-height:160px">
      <div id="rvFront" style="font-size:20px;white-space:pre-wrap"></div>
      <div id="rvBack" class="hidden" style="margin-top:16px;border-top:2px solid var(--swan);padding-top:12px">
        <div class="row" style="align-items:center;margin:0">
          <div id="rvBackText" style="font-size:20px;font-weight:900;color:var(--tree-frog)"></div>
          <button class="icon-btn" id="rvSpeak" aria-label="다시 듣기">🔊</button>
        </div>
        <div id="rvNote" class="muted" style="margin-top:6px"></div>
        <button id="shadow" class="hold btn-blue">🗣️ 꾹 눌러 따라 말하기</button>
        <div id="shadowResult" style="margin-top:8px;white-space:pre-wrap"></div>
      </div>
    </div>
    <button class="primary" id="rvReveal">정답 보기</button>
    <div class="row hidden" id="rvGrade">
      <button id="rvMissed" class="btn-red">😵 몰랐어</button>
      <button id="rvKnew" class="btn-green">😎 알았어</button>
    </div>
  </section>

  <section id="chat" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="row" style="flex:none">
      <button class="small" id="back" style="flex:none">← 나가기</button>
      <button class="small" id="finish" style="flex:none">끝내고 피드백</button>
    </div>
    <div id="log"></div>
    <div id="hints"></div>
    <div id="status"></div>
    <div class="row" style="flex:none">
      <input id="text" type="text" placeholder="말하기 어려우면 입력" autocomplete="off" autocapitalize="sentences">
      <button class="small" id="send" style="flex:none">전송</button>
      <button class="small" id="hint" style="flex:none">💡 힌트</button>
    </div>
    <div id="micRow">
      <button id="talkKo" class="hold">🇰🇷 꾹 눌러 한국어로 말하기</button>
      <button id="talk" class="hold btn-green">🎤 누르고 말하기</button>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
